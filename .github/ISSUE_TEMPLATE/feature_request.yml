name: Feature request
description: Suggest something Roost should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do in your game or studio, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you'd want it to work, from the point of view of whoever uses it (a game calling the SDK, someone in the dashboard).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Analytics
        - Crashes and bug reports
        - AI proxy
        - Remote config and flags
        - Dashboard
        - JS SDK
        - Rust SDK
        - Self-hosting
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other ways this could be solved.
