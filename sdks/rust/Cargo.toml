[package]
name = "roost-sdk"
version = "0.2.0"
edition = "2024"
description = "Roost SDK for the custom Rust engine"
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
