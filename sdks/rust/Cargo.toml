[package]
name = "roost-sdk"
version = "0.2.0"
edition = "2024"
description = "Roost SDK for the custom Rust engine"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
crash-handler = { version = "0.8.1", optional = true }
minidumper = { version = "0.11.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[features]
default = []
# Hard-crash capture (segfaults, aborts) as minidumps, written by a monitor process.
native-crashes = ["dep:crash-handler", "dep:minidumper"]

# Re-runs itself as a game that really crashes, so it needs its own `main` (no libtest).
[[test]]
name = "native_crash"
harness = false
required-features = ["native-crashes"]

[[test]]
name = "minidumps"
required-features = ["native-crashes"]
